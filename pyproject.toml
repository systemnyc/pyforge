[project]
name = "pyforge"
version = "0.1.0"
description = "Pforge is a spacial repition Python Traning Coach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "llm-client>=0.8.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pyforge = "pyforge:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
